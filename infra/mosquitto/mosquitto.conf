# Mission 3 - Configuration du broker Mosquitto

listener 1883

# Pas d'accès anonyme : chaque client a son propre compte
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout

# Création des comptes (à faire une fois, avant le premier lancement) :
#   docker compose run --rm mosquitto mosquitto_passwd -c -b /mosquitto/config/passwd gestion MOT_DE_PASSE
#   docker compose run --rm mosquitto mosquitto_passwd -b /mosquitto/config/passwd esp1 MOT_DE_PASSE
#   docker compose run --rm mosquitto mosquitto_passwd -b /mosquitto/config/passwd nodered MOT_DE_PASSE
# Le fichier passwd est exclu de GitHub (.gitignore).
